<aside class="sidebar" id="sidebar" aria-label="分类目录">
  <div class="sidebar-head">
    <a class="site-brand" href="{{ "" | relURL }}"><img src="{{ "assets/icon.png" | relURL }}" width="42" height="42" alt=""><span>ChineseBQB<small>中国人的表情包</small></span></a>
    <label class="sidebar-search"><span aria-hidden="true">⌕</span><input type="search" id="category-filter" placeholder="查找分类…" aria-label="查找分类"></label>
    <a class="all-categories {{ if .IsHome }}active{{ end }}" href="{{ "" | relURL }}"><span>▦ &nbsp; 全部表情包</span><span>{{ hugo.Data.catalog.total }}</span></a>
    <div class="sidebar-caption"><span>分类目录</span><span>{{ len hugo.Data.catalog.categories }} 个分类</span></div>
  </div>
  <nav class="sidebar-nav"><ul>
  {{ range hugo.Data.catalog.categories }}
    <li data-category-label="{{ .folder }} {{ .title }}"><a href="{{ .url | relURL }}" {{ if eq $.Params.category .slug }}aria-current="page"{{ end }}><span class="category-number">{{ .number | default "·" }}</span><span class="category-title">{{ .title }}</span><span class="category-count">{{ .count }}</span></a></li>
  {{ end }}
  </ul><p id="no-categories" class="sidebar-empty" hidden>没有匹配的分类</p></nav>
  <div class="sidebar-bottom">每一种情绪，都有一张表情包。</div>
</aside>
