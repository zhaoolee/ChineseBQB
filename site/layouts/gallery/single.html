{{ define "main" }}
  {{ $slug := .Params.category }}
  {{ $images := index hugo.Data.galleries $slug }}
  <nav class="breadcrumbs" aria-label="当前位置"><a href="{{ "" | relURL }}">全部分类</a><span>/</span><span>{{ .Title }}</span></nav>
  <div class="gallery-actions"><button class="button primary" id="download-pack" data-filename="{{ .Title }}.zip" {{ if not $images }}disabled{{ end }}>打包下载 ↓</button></div>
  {{ if $images }}
    <div class="gallery-toolbar"><label class="filter-field"><span aria-hidden="true">⌕</span><input type="search" id="gallery-filter" placeholder="在这个分类里找一找…" aria-label="搜索当前分类"></label></div>
    <div class="image-grid" id="image-grid">
    {{ range $images }}
      <article class="image-card" data-name="{{ .label }}">
        <a class="image-preview" href="{{ .src | relURL }}" data-preview data-name="{{ .name }}" data-src="{{ .src | relURL }}"><img src="{{ .thumb | relURL }}" width="360" height="300" alt="{{ .label }}" loading="lazy"></a>
        <div class="image-caption"><span title="{{ .label }}">{{ .label }}</span><a class="image-download" href="{{ .src | relURL }}" download="{{ .name }}" aria-label="保存 {{ .name }}" title="下载原图"></a></div>
      </article>
    {{ end }}
    </div>
    <p class="empty-state" id="gallery-empty" role="status" hidden>没有找到这张表情包，换个词试试吧。</p>
  {{ else }}<p class="empty-state">这个分类还没有图片，快乐正在路上。</p>{{ end }}
{{ end }}
